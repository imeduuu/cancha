# MongoDB para apps/api: replica set de un nodo (las transacciones lo requieren).
# npm run db:up  -> levanta y espera a que el healthcheck esté sano
# npm run db:down -> detiene (los datos quedan en el volumen cancha-mongo-data)
#
# La versión debe coincidir con config.mongodbMemoryServer.version de
# apps/api/package.json (binario de las pruebas).
#
# Pendiente (fase 8): el miembro del replica set se anuncia como localhost:27017.
# Sirve para conectarse desde el host (directConnection=true), pero no desde otro
# contenedor (la API dockerizada): habrá que anunciar el nombre del servicio.
name: cancha

services:
  mongo:
    image: mongo:8.0.38
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicia el replica set la primera vez y luego sólo confirma su estado.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
    name: cancha-mongo-data
